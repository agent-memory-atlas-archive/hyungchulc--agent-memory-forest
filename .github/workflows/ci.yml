name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Public release audit
        run: python scripts/audit_public_release.py --root .
      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pip wheel --no-deps --wheel-dir dist .
      - name: Clean-install wheel smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          smoke_root="${RUNNER_TEMP}/memory-forest-wheel-smoke"
          python -m venv "$smoke_root/venv"
          "$smoke_root/venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$smoke_root/venv/bin/python" -c 'import memory_forest; from importlib.metadata import version; assert memory_forest.__version__ == "1.0.0a1" == version("memory-forest")'
          "$smoke_root/venv/bin/memory-forest" --version
          "$smoke_root/venv/bin/memory-forest" --help >/dev/null
          "$smoke_root/venv/bin/memory-forest" init "$smoke_root/forest" --example
          "$smoke_root/venv/bin/memory-forest" validate "$smoke_root/forest"
