[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-forest"
dynamic = ["version"]
description = "A readable, rule-kept local memory for long-running AI agents and teams of agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hyungchul Choi" },
]
keywords = [
  "agents",
  "ai-memory",
  "knowledge-management",
  "local-first",
  "provenance",
  "retrieval",
  "sqlite",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hyungchulc/agent-memory-forest"
Repository = "https://github.com/hyungchulc/agent-memory-forest"
Issues = "https://github.com/hyungchulc/agent-memory-forest/issues"

[project.scripts]
memory-forest = "memory_forest.cli:main"
forest = "memory_forest.cli:forest_main"

[project.entry-points."memory_forest.adapters"]
jsonl = "memory_forest.adapters.jsonl:adapter"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "memory_forest.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_forest = ["letters/*.json", "phrases/*.json", "guide/*.md"]
